<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SportZone | Ofertas deportivas</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #fff;
      background: #111;
    }

    nav {
      padding: 1.25rem 8%;
      background: #181818;
    }

    nav ul {
      display: flex;
      gap: 2rem;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    nav li {
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
    }

    main {
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: center;
      gap: 3rem;
      min-height: 80vh;
      padding: 4rem 8%;
      background: linear-gradient(120deg, #111 48%, #252525 48%);
    }

    h1 {
      max-width: 650px;
      margin: 0;
      font-size: clamp(2.5rem, 6vw, 5.5rem);
      line-height: 1.05;
      text-transform: uppercase;
    }

    h1 span {
      color: #ff4d24;
    }

    p {
      color: #ccc;
      font-size: 1.2rem;
      line-height: 1.6;
    }

    img {
      display: block;
      width: 100%;
      max-width: 600px;
      height: auto;
      border-radius: 1rem;
      object-fit: cover;
    }

    @media (max-width: 700px) {
      main {
        grid-template-columns: 1fr;
        padding: 3rem 7%;
      }

      nav ul {
        gap: 1.25rem;
      }
    }
  </style>
</head>
<body>
  <nav aria-label="Menú principal">
    <ul>
      <li>pagina 1</li>
      <li>pagina 2</li>
      <li>pagina 3</li>
    </ul>
  </nav>

  <main>
    <section>
      <h1>Equípate para <span>llegar más lejos</span></h1>
      <p>Descubre productos deportivos diseñados para acompañarte en cada entrenamiento y alcanzar tu próximo objetivo.</p>
    </section>

    <img
      src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&amp;fit=crop&amp;w=1200&amp;q=85"
      alt="Zapatilla deportiva roja"
    >
  </main>
</body>
</html>
